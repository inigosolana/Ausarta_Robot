version: '3.8'

services:
  # Base de datos MySQL
  db:
    image: mysql:8.0
    container_name: ausarta-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_NAME:-encuestas_ausarta}
      MYSQL_USER: ${DB_USER:-ausarta_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-ausarta_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - ausarta-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 20s
      retries: 10

  # Backend (API + LiveKit Agent)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ausarta-backend
    restart: unless-stopped
    ports:
      - "8002:8001" # Puerto externo 8002 → interno 8001
    environment:
      # LiveKit
      - LIVEKIT_URL=${LIVEKIT_URL}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}

      # SIP
      - SIP_OUTBOUND_TRUNK_ID=${SIP_OUTBOUND_TRUNK_ID}

      # AI Providers
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY}
      - CARTESIA_API_KEY=${CARTESIA_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}

      # Database Configuration
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-encuestas_ausarta}
      - DB_USER=${DB_USER:-ausarta_user}
      - DB_PASSWORD=${DB_PASSWORD:-ausarta_password}

      # Bridge
      - BRIDGE_SERVER_URL=http://127.0.0.1:8001
    networks:
      - ausarta-network
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - sqlite-data:/app/data # Mantener por si acaso, aunque ya no se usa
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8001/" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend (React + Nginx)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ausarta-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - ausarta-network
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://backend:8001
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/" ]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  ausarta-network:
    driver: bridge

volumes:
  sqlite-data:
    driver: local
  mysql-data:
    driver: local
